<div class="chart-wrap">
  <h4>{{ t.chartTitle }}</h4>
  <svg viewBox="0 0 600 280" class="chart-svg">
    @for (y of yTicks(); track y) {
      <line x1="50" [attr.y1]="y" x2="580" [attr.y2]="y" class="grid-line" />
    }
    <polyline [attr.points]="points()" fill="none" stroke="#7927ff" stroke-width="3" />
    @for (tick of xTicks(); track tick.x) {
      <text [attr.x]="tick.x" y="270" class="axis-label">{{ tick.label }}</text>
    }
  </svg>
</div>
