<div class="search">
  <div class="search-container">
    <input
      type="text"
      [placeholder]="t.searchPlaceholder"
      [ngModel]="projectsState.username()"
      (ngModelChange)="projectsState.setUsername($event)"
      (keydown.enter)="search()"
    />
    <button type="button" (click)="search()" [disabled]="projectsState.loading()">
      @if (projectsState.loading()) {
        <app-projects-spinner />
      } @else {
        <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 16 16" fill="currentColor">
          <path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85zm-5.242 1.156a5.5 5.5 0 1 1 0-11 5.5 5.5 0 0 1 0 11z"/>
        </svg>
      }
    </button>
  </div>
  <p class="align">{{ t.exploreRepos }}</p>
</div>
