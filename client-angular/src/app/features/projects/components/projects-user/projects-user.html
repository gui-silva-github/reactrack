<div class="user">
  <img title="Avatar do Usuário" [src]="user().avatar_url" [alt]="user().login" />
  <h2>{{ user().login }}</h2>
  @if (user().location) {
    <p class="location">
      <svg class="location-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5A2.5 2.5 0 1 1 12 6a2.5 2.5 0 0 1 0 5.5z"/>
      </svg>
      <span>{{ user().location }}</span>
    </p>
  }
  <div class="stats">
    <div>
      <p>{{ t.followers }}</p>
      <p class="number">{{ user().followers }}</p>
    </div>
    <div>
      <p>{{ t.following }}</p>
      <p class="number">{{ user().following }}</p>
    </div>
  </div>
  <a [href]="githubUrl + user().login + '?tab=repositories'" target="_blank" rel="noreferrer">
    {{ t.seeProjects }}
  </a>
</div>
