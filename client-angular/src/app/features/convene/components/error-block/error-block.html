<div class="error-block">
  <div class="icon">!</div>
  <div class="error-block-text">
    <h2>{{ title() }}</h2>
    <p>{{ message() }}</p>
    @if (errors()?.length) {
      <ul>
        @for (error of errors(); track error) {
          <li>{{ error }}</li>
        }
      </ul>
    }
  </div>
</div>
