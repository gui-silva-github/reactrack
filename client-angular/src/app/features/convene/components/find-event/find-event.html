<section class="content-section find" id="all-events-section">
  <header class="find-header">
    <h2 class="find-title">{{ t.t('findNextEvent') }}</h2>
    <form class="find-form" (ngSubmit)="search()">
      <input
        title="Pesquisa"
        class="find-input"
        type="search"
        [(ngModel)]="searchTerm"
        name="search"
        [placeholder]="t.t('searchPlaceholder')"
      />
      <button class="find-button" type="submit">{{ t.t('search') }}</button>
    </form>
  </header>

  @if (!submitted) {
    <p class="find-message">{{ t.t('insertSearchTerm') }}</p>
  } @else if (loading) {
    <div class="center"><app-loading-indicator /></div>
  } @else if (error) {
    <app-error-block [title]="t.t('loadEventsError')" [message]="t.t('tryAgainLater')" />
  } @else if (!results.length) {
    <p class="find-message">{{ t.t('noEventsFound') }}</p>
  } @else {
    <ul class="events-list">
      @for (event of results; track event.id) {
        <li><app-event-item [event]="event" /></li>
      }
    </ul>
  }
</section>
