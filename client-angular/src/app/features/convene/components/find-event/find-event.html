<section class="content-section find" id="all-events-section">
  <header class="margin">
    <h2 class="h2">{{ t.findNextEvent }}</h2>
    <form (ngSubmit)="search()">
      <input title="Pesquisa" class="input" type="search" [(ngModel)]="searchTerm" name="search" [placeholder]="t.searchPlaceholder" />
      <button class="button" type="submit">{{ t.search }}</button>
    </form>
  </header>

  @if (!submitted) {
    <p class="p">{{ t.insertSearchTerm }}</p>
  } @else if (loading) {
    <div class="center"><app-loading-indicator /></div>
  } @else if (error) {
    <app-error-block [title]="t.loadEventsError" [message]="t.tryAgainLater" />
  } @else if (!results.length) {
    <p class="p">{{ t.noEventsFound }}</p>
  } @else {
    <ul class="events-list">
      @for (event of results; track event.id) {
        <li><app-event-item [event]="event" /></li>
      }
    </ul>
  }
</section>
