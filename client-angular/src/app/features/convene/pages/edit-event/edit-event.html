<app-modal (closed)="close()">
  @if (loading) {
    <app-loading-indicator />
  } @else if (event) {
    <app-event-form [inputData]="event" (submitForm)="update($event)">
      @if (saving) {
        {{ t.t('sending') }}
      } @else {
        <a routerLink="../" class="button-text">
          {{ t.t('cancel') }}
        </a>
        <button type="submit" class="button">
          {{ t.t('update') }}
        </button>
      }
    </app-event-form>
  }
  @if (error) {
    <app-error-block [title]="t.t('updateError')" [message]="t.t('tryAgainLater')" />
  }
</app-modal>
