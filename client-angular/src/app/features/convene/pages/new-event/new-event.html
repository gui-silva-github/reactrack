<app-modal (closed)="close()">
  <app-event-form (submitForm)="create($event)">
    @if (saving) {
      {{ t.t('sending') }}
    } @else {
      <a routerLink="../" class="button-text">{{ t.t('cancel') }}</a>
      <button type="submit" class="button">{{ t.t('create') }}</button>
    }
  </app-event-form>

  @if (error) {
    <app-error-block [title]="t.t('createError')" [message]="t.t('tryAgainLater')" />
  }
</app-modal>
