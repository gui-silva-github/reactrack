<nav class="fixed inset-x-0 top-0 z-50 flex w-full items-center justify-between gap-3 border-b border-gray-200 bg-white px-4 py-3 shadow-lg dark:border-gray-700 dark:bg-gray-900 sm:px-12">

  <a routerLink="/" class="flex shrink-0 cursor-pointer items-center space-x-4">

    <img

      src="/assets/jpg/icon.jpg"

      [alt]="i18n.t('common.logoReactRack')"

      class="h-8 w-8 shrink-0 rounded-full border border-gray-200 dark:border-gray-600"

    />

    <span class="shrink-0 text-xl font-bold text-gray-800 dark:text-gray-50">

      {{ i18n.t('common.reactRack') }}

    </span>

  </a>



  <div class="hidden items-center space-x-1 md:flex">

    <button

      type="button"

      (click)="toggleLanguage()"

      class="min-w-[2.5rem] shrink-0 rounded-full border border-black px-3 py-2 text-sm font-semibold text-black transition duration-200 hover:bg-gray-100 dark:border-gray-400 dark:text-gray-100 dark:hover:bg-gray-700"

      [attr.title]="i18n.isEn() ? i18n.t('common.portugues') : i18n.t('common.ingles')"

    >

      {{ i18n.isEn() ? 'PT' : 'EN' }}

    </button>

    <app-theme-toggle />



    @for (link of navLinks(); track link.path) {

      <a

        [routerLink]="link.path"

        routerLinkActive="active"

        [routerLinkActiveOptions]="{ exact: false }"

        #rla="routerLinkActive"

        [class]="linkClasses(rla.isActive)"

      >

        {{ i18n.t('nav.' + link.navKey) }}

      </a>

    }

  </div>

</nav>
